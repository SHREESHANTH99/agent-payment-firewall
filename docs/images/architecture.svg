<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" style="background:#0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="480" y="40" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700" letter-spacing="1">AGENT PAYMENT FIREWALL ARCHITECTURE</text>
  <text x="480" y="65" text-anchor="middle" fill="#94a3b8" font-size="12">Deterministic Defense-in-Depth Pipeline for Autonomous Agent Settlement</text>

  <!-- Untrusted Agent Box -->
  <g transform="translate(40, 110)" filter="url(#shadow)">
    <rect width="180" height="280" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <rect width="180" height="36" rx="8" fill="#1d4ed8"/>
    <text x="90" y="23" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="600">Autonomous AI Agent</text>
    <text x="90" y="70" text-anchor="middle" fill="#e2e8f0" font-size="11">LLM Tool Calling</text>
    <text x="90" y="90" text-anchor="middle" fill="#64748b" font-size="10">(Web browsing / Checkout)</text>
    <line x1="20" y1="120" x2="160" y2="120" stroke="#334155" stroke-dasharray="4"/>
    <text x="90" y="150" text-anchor="middle" fill="#ef4444" font-size="11" font-weight="600">Poisoned DOM / Reviews</text>
    <text x="90" y="170" text-anchor="middle" fill="#94a3b8" font-size="10">Adversarial Prompt Injection</text>
    <rect x="25" y="210" width="130" height="40" rx="4" fill="#0284c7" />
    <text x="90" y="235" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">POST /intents</text>
  </g>

  <!-- Flow Arrow into Firewall -->
  <path d="M 220 250 L 290 250" stroke="#38bdf8" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- Firewall Container Box -->
  <g transform="translate(290, 95)" filter="url(#shadow)">
    <rect width="380" height="320" rx="10" fill="#0f172a" stroke="#e11d48" stroke-width="2"/>
    <rect width="380" height="40" rx="10" fill="#be123c"/>
    <text x="190" y="25" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700" letter-spacing="0.5">AGENT PAYMENT FIREWALL PIPELINE</text>

    <!-- Stage 1 -->
    <rect x="20" y="60" width="340" height="36" rx="4" fill="#1e293b" stroke="#475569"/>
    <circle cx="40" cy="78" r="10" fill="#38bdf8"/>
    <text x="40" y="82" text-anchor="middle" fill="#0f172a" font-size="10" font-weight="700">1</text>
    <text x="65" y="82" fill="#f1f5f9" font-size="11" font-weight="600">Idempotency &amp; Payload Hash Check (Redis SETNX)</text>

    <!-- Stage 2 -->
    <rect x="20" y="105" width="340" height="36" rx="4" fill="#1e293b" stroke="#475569"/>
    <circle cx="40" cy="123" r="10" fill="#38bdf8"/>
    <text x="40" y="127" text-anchor="middle" fill="#0f172a" font-size="10" font-weight="700">2</text>
    <text x="65" y="127" fill="#f1f5f9" font-size="11" font-weight="600">Mandate Rules (Allowlist, Caps, Policy Controls)</text>

    <!-- Stage 3 -->
    <rect x="20" y="150" width="340" height="36" rx="4" fill="#1e293b" stroke="#475569"/>
    <circle cx="40" cy="168" r="10" fill="#38bdf8"/>
    <text x="40" y="172" text-anchor="middle" fill="#0f172a" font-size="10" font-weight="700">3</text>
    <text x="65" y="172" fill="#f1f5f9" font-size="11" font-weight="600">Atomic Budget Reservation (Lua Script In-Memory)</text>

    <!-- Stage 4 -->
    <rect x="20" y="195" width="340" height="36" rx="4" fill="#1e293b" stroke="#475569"/>
    <circle cx="40" cy="213" r="10" fill="#f59e0b"/>
    <text x="40" y="217" text-anchor="middle" fill="#0f172a" font-size="10" font-weight="700">4</text>
    <text x="65" y="217" fill="#f1f5f9" font-size="11" font-weight="600">Honeypot Canary Tool Call Detection</text>

    <!-- Stage 5 -->
    <rect x="20" y="240" width="340" height="36" rx="4" fill="#1e293b" stroke="#475569"/>
    <circle cx="40" cy="258" r="10" fill="#f59e0b"/>
    <text x="40" y="262" text-anchor="middle" fill="#0f172a" font-size="10" font-weight="700">5</text>
    <text x="65" y="262" fill="#f1f5f9" font-size="11" font-weight="600">LLM Semantic Risk Judge (Fail-Closed)</text>
  </g>

  <!-- Flow Arrows to Outcomes -->
  <path d="M 670 170 L 730 170" stroke="#10b981" stroke-width="2" fill="none"/>
  <path d="M 670 250 L 730 250" stroke="#f59e0b" stroke-width="2" fill="none"/>
  <path d="M 670 330 L 730 330" stroke="#ef4444" stroke-width="2" fill="none"/>

  <!-- Decision Outcomes Box -->
  <g transform="translate(730, 110)">
    <!-- Approved -->
    <rect x="0" y="30" width="190" height="55" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <text x="15" y="52" fill="#34d399" font-size="12" font-weight="700">APPROVED</text>
    <text x="15" y="72" fill="#a7f3d0" font-size="10">PayPal Payouts Sandbox</text>

    <!-- Escalated -->
    <rect x="0" y="115" width="190" height="55" rx="6" fill="#78350f" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="15" y="137" fill="#fbbf24" font-size="12" font-weight="700">ESCALATED</text>
    <text x="15" y="157" fill="#fde68a" font-size="10">Operator Review via WebSocket</text>

    <!-- Blocked -->
    <rect x="0" y="195" width="190" height="55" rx="6" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5"/>
    <text x="15" y="217" fill="#f87171" font-size="12" font-weight="700">DENIED / FROZEN</text>
    <text x="15" y="237" fill="#fecaca" font-size="10">Release Reservation &amp; Halt</text>
  </g>

  <!-- Bottom Ledger Bar -->
  <rect x="290" y="430" width="380" height="30" rx="4" fill="#1e293b" stroke="#334155"/>
  <text x="480" y="450" text-anchor="middle" fill="#94a3b8" font-size="11">PostgreSQL Immutable SHA-256 Hash Chained Audit Ledger</text>
</svg>
