services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: payment_firewall_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/firewall
      - REDIS_URL=redis://redis:6379/0
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID:-}
      - PAYPAL_CLIENT_SECRET=${PAYPAL_CLIENT_SECRET:-}
      - PAYPAL_WEBHOOK_ID=${PAYPAL_WEBHOOK_ID:-}
      - PAYPAL_MODE=${PAYPAL_MODE:-sandbox}
      - PAYPAL_TEST_RECEIVER_EMAIL=${PAYPAL_TEST_RECEIVER_EMAIL:-sb-receiver@personal.example.com}
      - OPERATOR_TOKEN=${OPERATOR_TOKEN:-}
      - AGENT_API_KEYS=${AGENT_API_KEYS:-{}}
      - ESCALATION_TIMEOUT_SECONDS=${ESCALATION_TIMEOUT_SECONDS:-600}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.openai.com/v1}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - CANARY_MODEL=${CANARY_MODEL:-gpt-4o-mini}
      - JUDGE_MODEL=${JUDGE_MODEL:-gpt-4o-mini}
      - LLM_TIMEOUT_SECONDS=${LLM_TIMEOUT_SECONDS:-15}
      - JUDGE_FAIL_MODE=${JUDGE_FAIL_MODE:-escalate}
      - CANARY_ENABLED=${CANARY_ENABLED:-true}
      - JUDGE_ENABLED=${JUDGE_ENABLED:-true}
      - LLM_CACHE_ENABLED=${LLM_CACHE_ENABLED:-true}
      - LLM_FALLBACK_BASE_URL=${LLM_FALLBACK_BASE_URL:-}
      - LLM_FALLBACK_API_KEY=${LLM_FALLBACK_API_KEY:-}
      - LLM_FALLBACK_MODEL=${LLM_FALLBACK_MODEL:-}
      - DASHBOARD_ORIGIN=${DASHBOARD_ORIGIN:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: payment_firewall_postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=firewall
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d firewall"]
      interval: 3s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: payment_firewall_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
